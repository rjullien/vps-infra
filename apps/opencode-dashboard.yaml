apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencode-dashboard
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: .
    argocd-image-updater.argoproj.io/image-list: dashboard=ghcr.io/rjullien/opencode-usage-tracker
    argocd-image-updater.argoproj.io/dashboard.update-strategy: newest-build
    argocd-image-updater.argoproj.io/dashboard.allow-tags: regexp:^main$
    argocd-image-updater.argoproj.io/write-back-method: git
spec:
  project: default
  source:
    repoURL: 'https://github.com/rjullien/vps-infra.git'
    targetRevision: HEAD
    path: workloads/opencode-dashboard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: opencode-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
